[package]
name = "interleaved-study"
version = "2.0.0"
description = "Interleaved practice with spaced repetition for lesson documents"
edition = "2021"

[lib]
name = "interleaved_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "interleaved-study"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tokio-util = "0.7"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"
calamine = "0.38"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
base64 = "0.22"
rand = "0.8"
url = "2"
security-framework = "2.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
